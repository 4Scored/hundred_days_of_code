<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating Edit</title>
</head>
<body>
    <form action="{{ url_for('edit') }}" method="POST">
        <p>Book Name: {{ book.title }}</p>
        <p>Current Rating: {{ book.rating }}</p>
        <input hidden name="book_id" value="{{ book.id }}"> <!-- for id "tracking" -->
        <input name="new_book_rating" type="text"/> <button type="submit">Change Rating</button>
    </form>
</body>
</html>
